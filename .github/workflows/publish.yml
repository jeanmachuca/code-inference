name: Publish image
#
# Tag-based publishing with SemVer — image tags follow git tags.
#
#   Version strategy (adhere to Semantic Versioning 2.0.0):
#     PATCH (v1.0.0 → v1.0.1):  Bug fixes, refactors, docs, CI changes.
#     MINOR (v1.0.0 → v1.1.0):  New features, additions, non-breaking changes.
#     MAJOR (v1.0.0 → v2.0.0):  Breaking changes (API, config, interface).
#
#   Process:
#     1. Merge topic PR → development
#     2. Open release PR: development → main
#     3. Merge release PR
#     4. Tag on main: git tag -a vMAJOR.MINOR.PATCH -m "..."
#     5. Push tag:       git push origin vMAJOR.MINOR.PATCH
#
#   Integration tags on development (after topic merge):
#     git tag -a vMAJOR.MINOR.PATCH-dev.N -m "..."
#     git push origin vMAJOR.MINOR.PATCH-dev.N
#

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/opencode-stack/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
